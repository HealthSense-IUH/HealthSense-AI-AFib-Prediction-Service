name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/healthsense-ai-service

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Ruff
      run: |
        python -m pip install --upgrade pip
        pip install ruff

    - name: Run Ruff Lint
      run: ruff check .

    - name: Run Ruff Format Check
      run: ruff format --check .

  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Run Pip Audit
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit
        pip-audit -r requirements.txt || true

  test:
    name: V6 Regression Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install test dependencies
      run: python -m pip install -r requirements.txt

    - name: Check V6 inference and PPG feature parity
      run: python -m unittest discover -s tests -p 'test_v6.py'

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Set up Python for model download
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install model download dependencies
      run: python -m pip install 'gdown==5.2.0' 'google-auth[requests]>=2.0,<3.0'

    - name: Cache verified V6 model files
      uses: actions/cache@v4
      with:
        path: |
          app/models/v6_stacking.pkl
          app/models/v6_stacking.json
        key: drive-v6-pair-e27370c51c8bbaf624abcbdabae40af5528d28bb2bd9e9249d1d5bf9cbb9b77c

    - name: Download and verify models from Google Drive
      env:
        GOOGLE_DRIVE_MODEL_URL: ${{ secrets.GOOGLE_DRIVE_MODEL_URL }}
        GOOGLE_DRIVE_MODEL_CARD_URL: ${{ secrets.GOOGLE_DRIVE_MODEL_CARD_URL }}
        GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
      run: python scripts/download_drive_models.py

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ${{ env.IMAGE_NAME }}:latest
          ${{ env.IMAGE_NAME }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
