services:
  ai-afib-prediction-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${REGISTRY:-healthsense}/${IMAGE_NAME:-ai-afib-prediction-service}:${IMAGE_TAG:-latest}
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
